<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teazzi-contact</title>
    <link rel="stylesheet" href="stylecontact.css">

</head>
<body>

    <nav>
        <div class="logo">
            <img src="Teazzi.jpg" alt="Teazzi Logo">
        </div>
        
        <div class="navlink">
             <div class="nav-container">
                <a href="home.html" >Home</a>
                <a href="about.html">About</a>
                <a href="menu.html">Menu</a>
                <a href="locations.html">Locations</a>
                <a href="contact.html"class="active">Contact</a>
            </div>
        </div>
    </nav>

    <section class="contact-section">
        <div class="contact-container">
            
            <div class="contact-info">
                <h1>Feel free to contact us if you have any questions or suggestions!</h1>
                <p>Have questions about our tea or partnership? Send us a message!</p>
                
                <div class="info-item">
                    <strong>Follow Us</strong><br>
                    <a href="https://www.instagram.com/teazzi.id/" target="_blank" class="link">@teazzi.id</a>
                </div>
            </div>

            
            <div class="contact-form">
                <form>
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" placeholder="Your Name">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" placeholder="Your Email">
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea rows="5" placeholder="How can we help you?"></textarea>
                    </div>
                        <button type="submit" class="btn">Send Message</button>
                </form>
            </div>
        </div>
    </section>

</body>
</html>
